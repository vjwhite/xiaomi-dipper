name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build kernel and device tarball
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            android-sdk-libsparse-utils e2fsprogs fakeroot flex git jq kmod \
            libelf-dev libssl-dev libtinfo5 lz4 python3 python-is-python3 \
            sudo unzip wget xz-utils pahole libbpf-dev
          chmod +x build.sh \
            overlay/system/usr/libexec/lxc-android-config/device-hacks \
            overlay/system/usr/bin/uinput-fpc-key-disable \
            overlay/system/usr/bin/uinput-goodix-key-disable
          ./build.sh
          rm -rf workdir
          df -h .

      - name: Build rootfs image for userdata
        run: |
          df -h .
          ./build/prepare-fake-ota.sh out/device_dipper.tar.xz ota
          ./build/system-image-from-ota.sh ota/ubuntu_command out
          rm -f out/system.img
          e2fsck -fy out/rootfs.img
          resize2fs -M out/rootfs.img
          min_blocks=$(dumpe2fs -h out/rootfs.img | awk '/Block count:/ {print $3}')
          resize2fs out/rootfs.img $((min_blocks + 262144))
          blocks=$(dumpe2fs -h out/rootfs.img | awk '/Block count:/ {print $3}')
          bsize=$(dumpe2fs -h out/rootfs.img | awk '/Block size:/ {print $3}')
          truncate -s $((blocks * bsize)) out/rootfs.img
          ls -lh out/boot.img out/rootfs.img
          test "$(stat -c%s out/boot.img)" -lt 67108864
          test "$(stat -c%s out/rootfs.img)" -lt 8589934592

      - name: Upload flashable images
        uses: actions/upload-artifact@v4
        with:
          name: dipper-24.04-images
          path: |
            out/boot.img
            out/rootfs.img
